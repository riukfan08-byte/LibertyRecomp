name: Build LibertyRecomp Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout LibertyRecomp experimental
        uses: actions/checkout@v5
        with:
          repository: OZORDI/LibertyRecomp
          ref: main
          submodules: false
          fetch-depth: 0
          
      - name: Download game payload
        run: |
          mkdir -p tools/local_game_payload

          curl -L \
            https://raw.githubusercontent.com/riukfan08-byte/LibertyRecomp/main/tools/local_game_payload/default.xex \
            -o tools/local_game_payload/default.xex

          curl -L \
            https://raw.githubusercontent.com/riukfan08-byte/LibertyRecomp/main/tools/local_game_payload/common.rpf \
            -o tools/local_game_payload/common.rpf

          curl -L \
            https://raw.githubusercontent.com/riukfan08-byte/LibertyRecomp/main/tools/local_game_payload/xbox360.rpf \
            -o tools/local_game_payload/xbox360.rpf

          curl -L \
            https://raw.githubusercontent.com/riukfan08-byte/LibertyRecomp/main/tools/local_game_payload/audio.rpf \
            -o tools/local_game_payload/audio.rpf

          echo "Payload descargado:"
          ls -lh tools/local_game_payload/

      - name: Initialize main submodules
        run: |
          git submodule sync
          git submodule update --init --force --depth 1 \
            thirdparty/GameNetworkingSockets \
            thirdparty/MoltenVK/MoltenVK \
            thirdparty/MoltenVK/SPIRV-Cross \
            thirdparty/SDL \
            thirdparty/SDL_mixer \
            thirdparty/concurrentqueue \
            thirdparty/ddspp \
            thirdparty/ffmpeg-core \
            thirdparty/imgui \
            thirdparty/implot \
            thirdparty/json \
            thirdparty/magic_enum \
            thirdparty/msdf-atlas-gen \
            thirdparty/nativefiledialog-extended \
            thirdparty/plume \
            thirdparty/stb \
            thirdparty/unordered_dense \
            thirdparty/vcpkg \
            tools/XenonRecomp \
            tools/XenosRecomp

      - name: Prepare RexGlue dependencies
        working-directory: glue/rexglue-sdk-main
        run: |
          rm -rf thirdparty/FFmpeg
          rm -rf thirdparty/abseil-cpp
          rm -rf thirdparty/libmspack
          rm -rf thirdparty/DirectXShaderCompiler
          rm -rf thirdparty/glslang
          rm -rf thirdparty/tomlplusplus
          rm -rf thirdparty/simde
          rm -rf thirdparty/xxHash

          git clone --depth 1 https://github.com/kyz/libmspack.git thirdparty/libmspack
          git clone --depth 1 https://github.com/microsoft/DirectXShaderCompiler.git thirdparty/DirectXShaderCompiler
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git thirdparty/glslang
          git clone --depth 1 https://github.com/xenia-project/FFmpeg.git thirdparty/FFmpeg
          git clone --depth 1 --branch lts_2024_07_22 https://github.com/abseil/abseil-cpp.git thirdparty/abseil-cpp
          git clone --depth 1 https://github.com/marzer/tomlplusplus.git thirdparty/tomlplusplus
          git clone --depth 1 https://github.com/simd-everywhere/simde.git thirdparty/simde
          git clone --depth 1 https://github.com/Cyan4973/xxHash.git thirdparty/xxHash

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Check game payload
        run: |
          echo "Contenido de tools/local_game_payload:"
          ls -lah tools/local_game_payload
          echo "Comprobando default.xex:"
          ls -lah tools/local_game_payload/default.xex

      - name: Check Android platform configuration
        run: |
          echo "Target platform:"
          grep -R "PLATFORM_LINUX" -n thirdparty/nativefiledialog-extended/CMakeLists.txt thirdparty/nativefiledialog-extended/src/CMakeLists.txt || true
          echo "Android configuration:"
          grep -R "ANDROID" -n thirdparty/nativefiledialog-extended/CMakeLists.txt thirdparty/nativefiledialog-extended/src/CMakeLists.txt | head -50 || true
      
      - name: Locate nativefiledialog
        run: |
          echo "Referencias a nativefiledialog:"
          grep -R "nativefiledialog" -n \
            --include="CMakeLists.txt" \
            --include="*.cmake" \
            . | head -50 || true
       
      - name: Disable nativefiledialog on Android
        run: |
          sed -i 's|add_subdirectory("${LIBERTY_RECOMP_THIRDPARTY_ROOT}/nativefiledialog-extended")|if(NOT ANDROID)\nadd_subdirectory("${LIBERTY_RECOMP_THIRDPARTY_ROOT}/nativefiledialog-extended")\nendif()|' thirdparty/CMakeLists.txt
      
      - name: Install OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev 
      
      - name: Check GameNetworkingSockets OpenSSL usage
        run: |
          sed -n '85,125p' thirdparty/GameNetworkingSockets/CMakeLists.txt
      
      - name: Check GameNetworkingSockets crypto
        run: |
          grep -n -B 3 -A 3 "USE_CRYPTO" thirdparty/GameNetworkingSockets/CMakeLists.txt | head -40
      
      - name: Configure Android crypto
        run: |
          grep -R "libsodium" -n thirdparty/GameNetworkingSockets/CMakeLists.txt thirdparty/GameNetworkingSockets/cmake 2>/dev/null | head -30
      
      - name: Check Android OpenSSL support
        run: |
          echo "=== OpenSSL references ==="
          grep -R -i "openssl" -n \
            CMakeLists.txt \
            toolchains \
            thirdparty/GameNetworkingSockets \
            2>/dev/null | head -80
      
      - name: Install Android OpenSSL
        env:
          VCPKG_ROOT: ${{ github.workspace }}/thirdparty/vcpkg
        run: |
          cd "$VCPKG_ROOT"
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg install openssl:arm64-android
      
      - name: Configure Android
        env:
          VCPKG_ROOT: ${{ github.workspace }}/thirdparty/vcpkg
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          cmake -B out/build/android-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=toolchains/android.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DLIBERTY_RECOMP_TARGET_PLATFORM=android \
            -DLIBERTY_RECOMP_EMBEDDED_GAME_PATH=tools/local_game_payload \
            -DVCPKG_ROOT="$VCPKG_ROOT"

      - name: Build Android
        run: |
          cmake --build out/build/android-release --parallel 2

      - name: Find Android output
        run: |
          echo "Searching for APK and shared libraries..."
          find . -type f \( -name "*.apk" -o -name "*.so" \) | head -100

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: LibertyRecomp-Android
          path: |
            out/build/android-release/**/*.apk
            out/build/android-release/**/*.so
          if-no-files-found: warn
          
