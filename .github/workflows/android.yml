name: Build LibertyRecomp Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout LibertyRecomp experimental
        uses: actions/checkout@v5
        with:
          repository: OZORDI/LibertyRecomp
          ref: experimental
          submodules: false
          fetch-depth: 0

      - name: Initialize main submodules
        run: |
          git submodule sync
          git submodule update --init --force --depth 1 \
            thirdparty/GameNetworkingSockets \
            thirdparty/MoltenVK/MoltenVK \
            thirdparty/MoltenVK/SPIRV-Cross \
            thirdparty/SDL \
            thirdparty/SDL_mixer \
            thirdparty/concurrentqueue \
            thirdparty/ddspp \
            thirdparty/ffmpeg-core \
            thirdparty/imgui \
            thirdparty/implot \
            thirdparty/json \
            thirdparty/magic_enum \
            thirdparty/msdf-atlas-gen \
            thirdparty/nativefiledialog-extended \
            thirdparty/plume \
            thirdparty/stb \
            thirdparty/unordered_dense \
            thirdparty/vcpkg \
            tools/XenonRecomp \
            tools/XenosRecomp

      - name: Fix RexGlue submodule configuration
        run: |
          cd glue/rexglue-sdk-main
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' || true
          git config -f .gitmodules --get-regexp '^submodule\..*\.url$' || true
          git submodule sync --recursive

      - name: Initialize RexGlue dependencies
        working-directory: glue/rexglue-sdk-main
        run: |
          git submodule update --init --recursive --force

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Configure Android
        run: |
          cmake --preset android-release

      - name: Build Android
        run: |
          cmake --build out/build/android-release --parallel 2

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: LibertyRecomp-Android
          path: |
            out/build/android-release/**/*.apk
            out/build/android-release/**/*.so
